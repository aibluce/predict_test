plugins {
    id("java")
    id("application")
}

group = "com.ll.predict"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
    mainClass = "exchange.io.Main"
}

/**
 * 跑评分脚本：./gradlew runScript -Pscript=scripts/sample_fee.txt
 * 注意用 providers.gradleProperty：Gradle 9 下 project.findProperty("script") 会被同名属性挡住，拿到的是 false。
 */
def scriptPath = providers.gradleProperty("script").getOrElse("scripts/sample_nofee.txt")

tasks.register("runScript", JavaExec) {
    group = "application"
    description = "读操作脚本（-Pscript=<路径>）并把结果打到标准输出"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "exchange.io.Main"
    args = [scriptPath]
}

tasks.test {
    useJUnitPlatform()
}
